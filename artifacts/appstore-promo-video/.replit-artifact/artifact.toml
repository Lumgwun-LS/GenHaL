kind = "video"
previewPath = "/appstore-promo-video/"
title = "Awajimaa App Store — Promotional Ad Video"
version = "1.0.0"
id = "artifacts/appstore-promo-video"
router = "path"

[[services]]
name = "web"
paths = [ "/appstore-promo-video/" ]
localPort = 21732

[services.development]
run = "pnpm --filter @workspace/appstore-promo-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/appstore-promo-video", "run", "build" ]
serve = "static"
publicDir = "artifacts/appstore-promo-video/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21732"
BASE_PATH = "/appstore-promo-video/"

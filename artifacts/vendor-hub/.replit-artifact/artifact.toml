kind = "web"
previewPath = "/"
title = "Awa Biz Suite"
version = "1.0.0"
id = "artifacts/vendor-hub"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22220

[services.development]
run = "pnpm --filter @workspace/vendor-hub run dev"

[services.production]
build = [ "sh", "-c", "pnpm --filter @workspace/vendor-hub run build && pnpm --filter @workspace/app-store run build:standalone && pnpm --filter @workspace/genhal-web run build:standalone" ]
run = [ "node", "artifacts/vendor-hub/host-router.mjs" ]

[services.env]
PORT = "22220"
BASE_PATH = "/"

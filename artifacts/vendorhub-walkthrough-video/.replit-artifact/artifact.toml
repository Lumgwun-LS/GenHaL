kind = "video"
previewPath = "/vendorhub-walkthrough-video/"
title = "Walkthrough Video"
version = "1.0.0"
id = "artifacts/vendorhub-walkthrough-video"
router = "path"

[[services]]
name = "web"
paths = [ "/vendorhub-walkthrough-video/" ]
localPort = 24410

[services.development]
run = "pnpm --filter @workspace/vendorhub-walkthrough-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vendorhub-walkthrough-video", "run", "build" ]
serve = "static"
publicDir = "artifacts/vendorhub-walkthrough-video/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24410"
BASE_PATH = "/vendorhub-walkthrough-video/"

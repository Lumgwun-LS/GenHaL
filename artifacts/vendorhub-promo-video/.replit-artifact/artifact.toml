kind = "video"
previewPath = "/vendorhub-promo-video/"
title = "Awa Promo Video"
version = "1.0.0"
id = "artifacts/vendorhub-promo-video"
router = "path"

[[services]]
name = "web"
paths = [ "/vendorhub-promo-video/" ]
localPort = 19679

[services.development]
run = "pnpm --filter @workspace/vendorhub-promo-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vendorhub-promo-video", "run", "build" ]
serve = "static"
publicDir = "artifacts/vendorhub-promo-video/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19679"
BASE_PATH = "/vendorhub-promo-video/"

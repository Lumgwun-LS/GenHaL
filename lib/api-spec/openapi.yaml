      operationId: sendEmailCampaign
      tags: [email-campaigns]
      summary: Send an email campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Send result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignSendResult"


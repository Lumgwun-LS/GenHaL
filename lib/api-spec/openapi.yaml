components:
  securitySchemes:
    externalBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by POST /external/auth/handshake
    clerkAuth:
      type: http
      scheme: bearer
      description: Clerk session token for the signed-in first-party mobile app user

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ─── VENDOR ─────────────────────────────────────────────────────────────
    Vendor:
      type: object
      required: [id, name, industry, status, email, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        industry:
          type: string
        status:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        clerkUserId:
          type: ["string", "null"]
        createdAt:
          type: string
        stripeEnabled:
          type: boolean
        paystackEnabled:
          type: boolean
        remitaEnabled:
          type: boolean
        flutterwaveEnabled:
          type: boolean
        nombaEnabled:
          type: boolean
        paypalEnabled:
          type: boolean
        defaultCurrency:
          type: string
        brandTheme:
          type: string
        gender:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        pushPaymentAlertsEnabled:
          type: boolean
        pushVoiceCampaignAlertsEnabled:
          type: boolean
        pushPostRemindersEnabled:
          type: boolean
        announcementEmailOptOut:
          type: boolean
        subscriptionTier:
          type: string
        verificationLevel:
          type: string
        stripeCustomerId:
          type: ["string", "null"]
        stripeSubscriptionId:
          type: ["string", "null"]
        subscriptionProvider:
          type: ["string", "null"]
        paystackCustomerCode:
          type: ["string", "null"]
        paystackSubscriptionCode:
          type: ["string", "null"]
        paystackEmailToken:
          type: ["string", "null"]
        dateOfBirth:
          type: ["string", "null"]
        voiceCallOptOut:
          type: boolean

    VendorOnboardingInput:
      type: object
      required: [name, phone, country]
      properties:
        name:
          type: string
        phone:
          type: string
        country:
          type: string
        state:
          type: string
        city:
          type: string

    VendorInput:
      type: object
      required: [name, industry, email]
      properties:
        name:
          type: string
        industry:
          type: string
        email:
          type: string
        phone:
          type: string
        website:
          type: string
        address:
          type: string
        logoUrl:
          type: string
        description:
          type: string

    VendorUpdate:
      type: object
      properties:
        name:
          type: string
        industry:
          type: string
        email:
          type: string
        phone:
          type: string
        website:
          type: string
        address:
          type: string
        logoUrl:
          type: string
        description:
          type: string
        status:
          type: string
        brandTheme:
          type: string
        gender:
          type: string
        country:
          type: string
        state:
          type: string
        city:
          type: string
        pushPaymentAlertsEnabled:
          type: boolean
        pushVoiceCampaignAlertsEnabled:
          type: boolean
        pushPostRemindersEnabled:
          type: boolean
        announcementEmailOptOut:
          type: boolean

    DeletionEligibility:
      type: object
      required: [eligible, reasons]
      properties:
        eligible:
          type: boolean
        reasons:
          type: array
          items:
            type: string

    DeletionRequestResult:
      type: object
      required: [requestId, expiresAt, emailDelivery, smsDelivery]
      properties:
        requestId:
          type: integer
        expiresAt:
          type: string
        emailDelivery:
          type: string
        smsDelivery:
          type: string

    DeletionVerifyInput:
      type: object
      required: [emailCode, phoneCode]
      properties:
        emailCode:
          type: string
        phoneCode:
          type: string

    VendorNotification:
      type: object
      required: [id, vendorId, type, message, readAt, createdAt]
      properties:
        id:
          type: integer
        vendorId:
          type: integer
        type:
          type: string
          description: '"birthday" | "tier_change" | "verification_change" | "general"'
        message:
          type: string
        adminUserId:
          type: ["string", "null"]
        adminDisplayName:
          type: ["string", "null"]
        previousTier:
          type: ["string", "null"]
        newTier:
          type: ["string", "null"]
        readAt:
          type: ["string", "null"]
        createdAt:
          type: string

    VendorNotificationInput:
      type: object
      required: [message]
      properties:
        message:
          type: string
          maxLength: 1000

    BulkVendorNotificationInput:
      type: object
      required: [message]
      properties:
        message:
          type: string
          maxLength: 1000
        vendorIds:
          type: array
          items:
            type: integer
          description: Target vendor ids. Ignored when `all` is true.
        all:
          type: boolean
          description: When true, sends to every vendor and `vendorIds` is ignored.

    BulkVendorNotificationResult:
      type: object
      required: [sent, emailsSent, emailAttempted, failures]
      properties:
        sent:
          type: integer
          description: Number of in-app notifications created
        emailsSent:
          type: integer
          description: Number of announcement emails successfully delivered
        emailAttempted:
          type: integer
          description: Number of vendors an announcement email was attempted for
        failures:
          type: array
          description: Vendors who did not get the announcement email, with why
          items:
            $ref: "#/components/schemas/BulkVendorNotificationEmailFailure"

    BulkVendorNotificationEmailFailure:
      type: object
      required: [vendorId, vendorName, reason]
      properties:
        vendorId:
          type: integer
        vendorName:
          type: string
        reason:
          type: string
          enum: [opted_out, no_email, send_failed]
          description: >
            opted_out = vendor opted out of announcement emails,
            no_email = vendor has no email address on file,
            send_failed = the email was attempted but delivery failed

    AdminMessageHistoryEntry:
      type: object
      required: [id, vendorId, vendorName, message, adminUserId, adminDisplayName, createdAt]
      properties:
        id:
          type: integer
        vendorId:
          type: integer
        vendorName:
          type: ["string", "null"]
        message:
          type: string
        adminUserId:
          type: ["string", "null"]
        adminDisplayName:
          type: ["string", "null"]
        createdAt:
          type: string

    DemographicBucket:
      type: object
      required: [key, count]
      properties:
        key:
          type: string
        count:
          type: integer

    PaymentDemographicBucket:
      type: object
      required: [key, total, count]
      properties:
        key:
          type: string
        total:
          type: number
        count:
          type: integer

    TimeSeriesCountPoint:
      type: object
      required: [date, count]
      properties:
        date:
          type: string
        count:
          type: integer

    TimeSeriesAmountPoint:
      type: object
      required: [date, amount]
      properties:
        date:
          type: string
        amount:
          type: number

    AdminDemographicsAnalytics:
      type: object
      required:
        - range
        - totalUsers
        - totalRevenue
        - usersByGender
        - usersByCountry
        - usersByState
        - usersByCity
        - paymentsByGender
        - paymentsByCountry
        - paymentsByState
        - paymentsByCity
        - signupsOverTime
        - revenueOverTime
      properties:
        range:
          type: object
          required: [from, to, period]
          properties:
            from:
              type: string
            to:
              type: string
            period:
              type: string
        totalUsers:
          type: integer
        totalRevenue:
          type: number
        usersByGender:
          type: array
          items:
            $ref: "#/components/schemas/DemographicBucket"
        usersByCountry:
          type: array
          items:
            $ref: "#/components/schemas/DemographicBucket"
        usersByState:
          type: array
          items:
            $ref: "#/components/schemas/DemographicBucket"
        usersByCity:
          type: array
          items:
            $ref: "#/components/schemas/DemographicBucket"
        paymentsByGender:
          type: array
          items:
            $ref: "#/components/schemas/PaymentDemographicBucket"
        paymentsByCountry:
          type: array
          items:
            $ref: "#/components/schemas/PaymentDemographicBucket"
        paymentsByState:
          type: array
          items:
            $ref: "#/components/schemas/PaymentDemographicBucket"
        paymentsByCity:
          type: array
          items:
            $ref: "#/components/schemas/PaymentDemographicBucket"
        signupsOverTime:
          type: array
          items:
            $ref: "#/components/schemas/TimeSeriesCountPoint"
        revenueOverTime:
          type: array
          items:
            $ref: "#/components/schemas/TimeSeriesAmountPoint"

    VendorPerformanceAnalytics:
      type: object
      required:
        - range
        - totalRevenue
        - totalOrders
        - completedOrders
        - uniqueCustomers
        - averageOrderValue
        - revenueOverTime
        - ordersOverTime
      properties:
        range:
          type: object
          required: [from, to, period]
          properties:
            from:
              type: string
            to:
              type: string
            period:
              type: string
        totalRevenue:
          type: number
        totalOrders:
          type: integer
        completedOrders:
          type: integer
        uniqueCustomers:
          type: integer
        averageOrderValue:
          type: number
        revenueOverTime:
          type: array
          items:
            $ref: "#/components/schemas/TimeSeriesAmountPoint"
        ordersOverTime:
          type: array
          items:
            $ref: "#/components/schemas/TimeSeriesCountPoint"

    VendorStats:
      type: object
      required: [totalVendors, activeVendors, industries, recentSignups]
      properties:
        totalVendors:
          type: integer
        activeVendors:
          type: integer
        industries:
          type: array
          items:
            type: object
            required: [industry, count]
            properties:
              industry:
                type: string
              count:
                type: integer
        recentSignups:
          type: integer

    # ─── SOCIAL ACCOUNT ─────────────────────────────────────────────────────
    SocialAccount:
      type: object
      required: [id, vendorId, platform, accountName, status, createdAt]
      properties:
        id:
          type: integer
        vendorId:
          type: integer
        platform:
          type: string
        accountName:
          type: string
        accountId:
          type: ["string", "null"]
        profileUrl:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        status:
          type: string
        followersCount:
          type: ["integer", "null"]
        connectedVia:
          type: string
        tokenExpiresAt:
          type: ["string", "null"]
        createdAt:
          type: string

    SocialAccountInput:
      type: object
      required: [vendorId, platform, accountName]
      properties:
        vendorId:
          type: integer
        platform:
          type: string
        accountName:
          type: string
        accountId:
          type: string
        profileUrl:
          type: string
        avatarUrl:
          type: string
        followersCount:
          type: integer

    # ─── POST ───────────────────────────────────────────────────────────────
    Post:
      type: object
      required: [id, vendorId, caption, platforms, status, createdAt]
      properties:
        id:
          type: integer
        vendorId:
          type: integer
        caption:
          type: string
        platforms:
          type: array
          items:
            type: string
        socialAccountIds:
          type: array
          description: Aligned by index with platforms; which connected social account to publish each platform entry to. 0 means "not explicitly chosen".
          items:
            type: integer
        status:
          type: string
        autoPublishFailed:
          type: boolean

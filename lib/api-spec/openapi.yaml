    get:
      operationId: getAdminMessageHistory
      tags: [admin]
      summary: Admin-facing history of every custom message sent to vendors
      description: >
        Covers messages sent via the per-vendor compose dialog and the bulk-message tool
        (notification type "general"). Optionally filter to a single vendor.
      parameters:
        - name: vendorId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Messages, most recent first (max 200)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminMessageHistoryEntry"
        "400":
          description: Invalid vendorId
        "403":
          description: Admin access required

  # ─── EXTERNAL (AWAJIMAA BRIDGE) ──────────────────────────────────────────
  /external/auth/handshake:
    post:
      operationId: externalAuthHandshake
      tags: [external]
      summary: Exchange an Awajimaa API key + user identity for a VendorHub session token
      description: >
        Called once when an Awajimaa user opens the VendorHub mobile app.
        Auto-creates (or finds) the matching vendor profile and returns a
        signed JWT to use as a bearer token on all other /external/* routes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalHandshakeInput"
      responses:
        "200":
          description: Session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalHandshakeResponse"
        "401":
          description: Missing or invalid API key
        "400":
          description: Missing or invalid fields

  /external/auth/mobile-handshake:
    post:
      operationId: externalAuthMobileHandshake
      tags: [external]
      summary: Exchange a signed-in Clerk session for a VendorHub session token (first-party mobile app)
      description: >
        Called directly by the VendorHub Mobile app itself (not a
        third-party partner backend), after the vendor has signed in with
        Clerk. Requires a valid Clerk session (Authorization bearer token
        verified by clerkMiddleware) — identity is never self-declared by
        the request body. Auto-creates (or finds) the matching vendor
        profile keyed by the verified Clerk user id, and returns a signed
        JWT to use as a bearer token on all other /external/* routes.
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalMobileHandshakeInput"
      responses:
        "200":
          description: Session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalHandshakeResponse"
        "401":
          description: Missing or invalid Clerk session
        "400":
          description: Missing or invalid fields

  /external/auth/revoke:
    post:
      operationId: externalAuthRevoke
      tags: [external]
      summary: Revoke an external session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalRevokeInput"
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalRevokeResponse"

  /external/profile:
    get:
      operationId: getExternalProfile
      tags: [external]
      summary: Get the authenticated vendor's profile + enabled features
      security: [{ externalBearerAuth: [] }]
      responses:
        "200":
          description: Vendor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalProfileResponse"
    patch:
      operationId: updateExternalProfile
      tags: [external]
      summary: Update the authenticated vendor's own profile
      security: [{ externalBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalProfileUpdate"
      responses:
        "200":
          description: Updated vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"

  /external/orders:
    get:
      operationId: listExternalOrders
      tags: [external]
      summary: List the authenticated vendor's orders
      security: [{ externalBearerAuth: [] }]
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "403":
          description: Feature not available for this user type

  /external/products:
    get:
      operationId: listExternalProducts
      tags: [external]
      summary: List the authenticated vendor's products
      security: [{ externalBearerAuth: [] }]
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "403":
          description: Feature not available for this user type

  /external/inventory:
    get:
      operationId: listExternalInventory
      tags: [external]
      summary: List the authenticated vendor's inventory transactions
      security: [{ externalBearerAuth: [] }]
      responses:
        "200":
          description: List of inventory transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryTransaction"
        "403":
          description: Feature not available for this user type

  /external/analytics/summary:
    get:
      operationId: getExternalAnalyticsSummary
      tags: [external]
      summary: Lightweight counts summary for the vendor dashboard
      security: [{ externalBearerAuth: [] }]
      responses:
        "200":
          description: Summary counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalAnalyticsSummary"
        "403":
          description: Feature not available for this user type

  /external/payments:
    get:
      operationId: listExternalPayments
      tags: [external]
      summary: List the authenticated vendor's payment history
      security: [{ externalBearerAuth: [] }]
      responses:
        "200":
          description: List of payments, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"

  /external/voice-campaigns:
    get:
      operationId: listExternalVoiceCampaigns
      tags: [external]
      summary: List the authenticated vendor's voice campaigns, most recent first
      security: [{ externalBearerAuth: [] }]
      responses:
        "200":
          description: List of voice campaigns with call-count summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExternalVoiceCampaignSummary"

  /external/voice-campaigns/{id}:
    get:
      operationId: getExternalVoiceCampaign
      tags: [external]
      summary: Get a single voice campaign, its stats, and individual call records
      security: [{ externalBearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Voice campaign detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalVoiceCampaignDetail"
        "404":
          description: Campaign not found

  /external/push/register:
    post:
      operationId: registerExternalPushToken
      tags: [external]
      summary: Register this device's Expo push token for instant notifications
      security: [{ externalBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalPushTokenInput"
      responses:
        "200":
          description: Token registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalPushOkResponse"
        "400":
          description: Missing expoPushToken

  /external/push/unregister:
    post:
      operationId: unregisterExternalPushToken
      tags: [external]
      summary: Remove a device's Expo push token (e.g. on logout)
      security: [{ externalBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalPushTokenInput"
      responses:
        "200":
          description: Token removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalPushOkResponse"
        "400":
          description: Missing expoPushToken

  /external/payments/initialize:
    post:
      operationId: initializeExternalPayment
      tags: [external]
      summary: Initialize a Stripe or Paystack checkout for the vendor's order
      security: [{ externalBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalPaymentInitializeInput"
      responses:
        "200":
          description: Checkout initialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalPaymentInitializeResponse"
        "503":
          description: No payment gateway available

  /external/payments/{id}/cancel:
    post:
      operationId: cancelExternalPayment
      tags: [external]
      summary: Cancel a pending or failed payment (e.g. a stale checkout the vendor no longer wants)
      security: [{ externalBearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payment cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "404":
          description: Payment not found
        "409":
          description: Payment is not in a cancellable state

  /external/payments/{id}/retry:
    post:
      operationId: retryExternalPayment
      tags: [external]
      summary: Retry checkout for a pending or failed payment by starting a fresh session for the same order
      security: [{ externalBearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: New checkout initialized; original payment is marked cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalPaymentInitializeResponse"
        "404":
          description: Payment not found
        "409":
          description: Payment is not in a retryable state
        "503":
          description: No payment gateway available

components:
  securitySchemes:
    externalBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by POST /external/auth/handshake
    clerkAuth:
      type: http
      scheme: bearer
      description: Clerk session token for the signed-in first-party mobile app user

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ─── VENDOR ─────────────────────────────────────────────────────────────
    Vendor:
      type: object
      required: [id, name, industry, status, email, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        industry:
          type: string
        status:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        clerkUserId:
          type: ["string", "null"]
        createdAt:
          type: string
        stripeEnabled:
          type: boolean
        paystackEnabled:
          type: boolean
        remitaEnabled:
          type: boolean
        flutterwaveEnabled:
          type: boolean
        nombaEnabled:
          type: boolean
        defaultCurrency:
          type: string
        brandTheme:
          type: string
        gender:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        pushPaymentAlertsEnabled:
          type: boolean
        pushVoiceCampaignAlertsEnabled:
          type: boolean
        announcementEmailOptOut:
          type: boolean

    VendorOnboardingInput:
      type: object
      required: [name, phone, country]
      properties:
        name:
          type: string
        phone:
          type: string
        country:
          type: string
        state:
          type: string
        city:
          type: string

    VendorInput:
      type: object
      required: [name, industry, email]
      properties:
        name:
          type: string
        industry:
          type: string
        email:
          type: string
        phone:
          type: string
        website:
          type: string
        address:
          type: string
        logoUrl:
          type: string
        description:
          type: string

    VendorUpdate:
      type: object
      properties:
        name:
          type: string
        industry:
          type: string
        email:
          type: string
        phone:
          type: string
        website:
          type: string
        address:
          type: string
        logoUrl:
          type: string
        description:
          type: string
        status:
          type: string
        brandTheme:
          type: string
        gender:
          type: string
        country:
          type: string
        state:
          type: string
        city:
          type: string
        pushPaymentAlertsEnabled:
          type: boolean
        pushVoiceCampaignAlertsEnabled:
          type: boolean
        announcementEmailOptOut:
          type: boolean

    DeletionEligibility:
      type: object
      required: [eligible, reasons]
      properties:
        eligible:
          type: boolean
        reasons:
          type: array
          items:
            type: string

    DeletionRequestResult:
      type: object
      required: [requestId, expiresAt, emailDelivery, smsDelivery]
      properties:
        requestId:
          type: integer
        expiresAt:
          type: string
        emailDelivery:
          type: string
        smsDelivery:
          type: string

    DeletionVerifyInput:
      type: object
      required: [emailCode, phoneCode]
      properties:
        emailCode:
          type: string
        phoneCode:
          type: string

    VendorNotification:
      type: object
      required: [id, vendorId, type, message, readAt, createdAt]
      properties:
        id:
          type: integer
        vendorId:
          type: integer
        type:
          type: string
          description: '"birthday" | "tier_change" | "general"'
        message:
          type: string
        adminUserId:
          type: ["string", "null"]
        adminDisplayName:
          type: ["string", "null"]
        previousTier:
          type: ["string", "null"]
        newTier:
          type: ["string", "null"]
        readAt:
          type: ["string", "null"]
        createdAt:
          type: string

    VendorNotificationInput:
      type: object
      required: [message]
      properties:
        message:
          type: string
          maxLength: 1000

    BulkVendorNotificationInput:
      type: object
      required: [message]
      properties:
        message:
          type: string
          maxLength: 1000
        vendorIds:
          type: array
          items:
            type: integer
          description: Target vendor ids. Ignored when `all` is true.
        all:
          type: boolean
          description: When true, sends to every vendor and `vendorIds` is ignored.

    BulkVendorNotificationResult:
      type: object
      required: [sent, emailsSent, emailAttempted, failures]
      properties:
        sent:
          type: integer
          description: Number of in-app notifications created
        emailsSent:
          type: integer
          description: Number of announcement emails successfully delivered
        emailAttempted:
          type: integer
          description: Number of vendors an announcement email was attempted for
        failures:
          type: array
          description: Vendors who did not get the announcement email, with why
          items:
            $ref: "#/components/schemas/BulkVendorNotificationEmailFailure"

    BulkVendorNotificationEmailFailure:
      type: object
      required: [vendorId, vendorName, reason]
      properties:
        vendorId:
          type: integer
        vendorName:
          type: string
        reason:
          type: string
          enum: [opted_out, no_email, send_failed]
          description: >
            opted_out = vendor opted out of announcement emails,
            no_email = vendor has no email address on file,
            send_failed = the email was attempted but delivery failed

    AdminMessageHistoryEntry:
      type: object
      required: [id, vendorId, vendorName, message, adminUserId, adminDisplayName, createdAt]
      properties:
        id:
          type: integer
        vendorId:
          type: integer
        vendorName:
          type: ["string", "null"]
        message:
          type: string
        adminUserId:
          type: ["string", "null"]
        adminDisplayName:
          type: ["string", "null"]
        createdAt:
          type: string

    DemographicBucket:
      type: object
      required: [key, count]
      properties:
        key:
          type: string
        count:
          type: integer

    PaymentDemographicBucket:
      type: object
      required: [key, total, count]
      properties:
        key:
          type: string
        total:
          type: number
        count:
          type: integer

    TimeSeriesCountPoint:
      type: object
      required: [date, count]
      properties:
        date:
          type: string
        count:
          type: integer

    TimeSeriesAmountPoint:
      type: object
      required: [date, amount]
      properties:
        date:
          type: string
        amount:
          type: number

    AdminDemographicsAnalytics:
      type: object
      required:
        - range
        - totalUsers
        - totalRevenue
        - usersByGender
        - usersByCountry
        - usersByState
        - usersByCity
        - paymentsByGender
        - paymentsByCountry
        - paymentsByState
        - paymentsByCity
        - signupsOverTime
        - revenueOverTime
      properties:
        range:
          type: object
          required: [from, to, period]
          properties:
            from:
              type: string
            to:
              type: string
            period:
              type: string
        totalUsers:
          type: integer
        totalRevenue:
          type: number
        usersByGender:
          type: array
          items:
            $ref: "#/components/schemas/DemographicBucket"
        usersByCountry:
          type: array
          items:
            $ref: "#/components/schemas/DemographicBucket"
        usersByState:
          type: array
          items:
            $ref: "#/components/schemas/DemographicBucket"
        usersByCity:
          type: array
          items:
            $ref: "#/components/schemas/DemographicBucket"
        paymentsByGender:
          type: array
          items:
            $ref: "#/components/schemas/PaymentDemographicBucket"
        paymentsByCountry:
          type: array
          items:
            $ref: "#/components/schemas/PaymentDemographicBucket"
        paymentsByState:
          type: array
          items:
            $ref: "#/components/schemas/PaymentDemographicBucket"
        paymentsByCity:
          type: array
          items:
            $ref: "#/components/schemas/PaymentDemographicBucket"
        signupsOverTime:
          type: array
          items:
            $ref: "#/components/schemas/TimeSeriesCountPoint"
        revenueOverTime:
          type: array
          items:
            $ref: "#/components/schemas/TimeSeriesAmountPoint"

    VendorPerformanceAnalytics:
      type: object
      required:
        - range
        - totalRevenue
        - totalOrders
        - completedOrders
        - uniqueCustomers
        - averageOrderValue
        - revenueOverTime
        - ordersOverTime
      properties:
        range:
          type: object
          required: [from, to, period]
          properties:
            from:
              type: string
            to:
              type: string
            period:
              type: string
        totalRevenue:
          type: number
        totalOrders:
          type: integer
        completedOrders:
          type: integer
        uniqueCustomers:
          type: integer
        averageOrderValue:
          type: number
        revenueOverTime:
          type: array
          items:
            $ref: "#/components/schemas/TimeSeriesAmountPoint"
        ordersOverTime:
          type: array
          items:
            $ref: "#/components/schemas/TimeSeriesCountPoint"

    VendorStats:
      type: object
      required: [totalVendors, activeVendors, industries, recentSignups]
      properties:
        totalVendors:
          type: integer
        activeVendors:
          type: integer
        industries:
          type: array
          items:
            type: object
            required: [industry, count]
            properties:
              industry:
                type: string
              count:
                type: integer
        recentSignups:
          type: integer

    # ─── SOCIAL ACCOUNT ─────────────────────────────────────────────────────
    SocialAccount:
      type: object
      required: [id, vendorId, platform, accountName, status, createdAt]
      properties:
        id:
          type: integer
        vendorId:
          type: integer
        platform:
          type: string
        accountName:
          type: string
        accountId:
          type: ["string", "null"]
        profileUrl:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        status:
          type: string
        followersCount:
          type: ["integer", "null"]
        connectedVia:
          type: string
        tokenExpiresAt:
          type: ["string", "null"]
        createdAt:
          type: string

    SocialAccountInput:
      type: object
      required: [vendorId, platform, accountName]
      properties:
        vendorId:
          type: integer
        platform:
          type: string
        accountName:
          type: string
        accountId:
          type: string
        profileUrl:
          type: string
        avatarUrl:
          type: string
        followersCount:
          type: integer

    # ─── POST ───────────────────────────────────────────────────────────────
    Post:
      type: object
      required: [id, vendorId, caption, platforms, status, createdAt]
      properties:
        id:
          type: integer
        vendorId:
          type: integer
        caption:
          type: string
        platforms:
          type: array
          items:
            type: string
        socialAccountIds:
          type: array
          description: Aligned by index with platforms; which connected social account to publish each platform entry to. 0 means "not explicitly chosen".
          items:
            type: integer
        status:
          type: string
        autoPublishFailed:
          type: boolean
          description: True when the scheduled auto-publisher reverted this post to "approved" because every platform failed.
        mediaUrls:
          type: array
          items:
            type: string
        mediaType:
          type: ["string", "null"]
        scheduledAt:
          type: ["string", "null"]
        publishedAt:
          type: ["string", "null"]
        hashtags:
          type: ["string", "null"]
        aiGenerated:
          type: boolean
        engagementData:
          type: ["string", "null"]
        productIds:
          type: array
          items:
            type: integer
        linkMode:
          type: string
        shareToken:
          type: ["string", "null"]
        createdAt:
          type: string

    PostInput:
      type: object
      required: [vendorId, caption, platforms]
      properties:
        vendorId:
          type: integer
        caption:
          type: string
        platforms:
          type: array
          items:
            type: string
        socialAccountIds:
          type: array
          items:
            type: integer
        mediaUrls:
          type: array
          items:
            type: string
        mediaType:
          type: string
        scheduledAt:
          type: string
        hashtags:
          type: string
        aiGenerated:
          type: boolean
        productIds:
          type: array
          items:
            type: integer
        linkMode:
          type: string

    PostPublication:
      type: object
      required: [id, postId, platform, status, publishedAt]
      properties:
        id:
          type: integer
        postId:
          type: integer
        socialAccountId:
          type: ["integer", "null"]
        platform:
          type: string
        status:
          type: string
        externalPostId:
          type: ["string", "null"]
        externalUrl:
          type: ["string", "null"]
        errorMessage:
          type: ["string", "null"]
        publishedAt:
          type: string

    PostWithPublications:
      allOf:
        - $ref: "#/components/schemas/Post"
        - type: object
          required: [publications]
          properties:
            publications:
              type: array
              items:
                $ref: "#/components/schemas/PostPublication"

    SchedulePostInput:
      type: object
      required: [scheduledAt]
      properties:
        scheduledAt:
          type: string

    PostUpdate:
      type: object
      properties:
        caption:
          type: string
        platforms:
          type: array
          items:
            type: string
        socialAccountIds:
          type: array
          items:
            type: integer
        mediaUrls:
          type: array
          items:
            type: string
        scheduledAt:
          type: string
        hashtags:
          type: string
        status:
          type: string
        productIds:
          type: array
          items:
            type: integer
        linkMode:
          type: string

    # ─── AI ─────────────────────────────────────────────────────────────────
    AiGeneration:
      type: object
      required: [id, vendorId, type, prompt, status, createdAt]
      properties:
        id:
          type: integer
        vendorId:
          type: integer
        type:
          type: string
        prompt:
          type: string
        result:
          type: ["string", "null"]
        status:
          type: string
        createdAt:
          type: string

    AiImageRequest:
      type: object
      required: [vendorId, prompt]
      properties:
        vendorId:
          type: integer
        prompt:
          type: string
        style:
          type: string
        industry:
          type: string

    AiVideoRequest:
      type: object
      required: [vendorId, prompt]
      properties:
        vendorId:
          type: integer
        prompt:
          type: string
        style:
          type: string
        industry:
          type: string
        captionText:
          type: string
        sceneCount:
          type: integer
          minimum: 1
          maximum: 3
          description: Number of distinct visual scenes to generate and stitch together (with crossfade transitions). Defaults to 1.
        motionTemplate:
          type: string
          enum: [auto, zoom-in, zoom-out, pan-left, pan-right, zoom-pan]
          description: Camera motion style applied to each scene. "auto" cycles through templates across scenes. Defaults to "auto".
        includeMusic:
          type: boolean
          description: Whether to generate and mix in a short instrumental background track. Defaults to false.

    AiCaptionRequest:
      type: object
      required: [vendorId, topic, platform]
      properties:
        vendorId:
          type: integer
        topic:
          type: string
        platform:
          type: string
        tone:
          type: string
        includeHashtags:
          type: boolean
        includeEmoji:
          type: boolean

    AiVideoUploadUrlRequest:
      type: object
      required: [vendorId]
      properties:
        vendorId:
          type: integer

    AiVideoUploadUrlResponse:
      type: object
      required: [uploadUrl, videoUrl]
      properties:
        uploadUrl:
          type: string
          description: Presigned PUT URL — client should PUT the raw video bytes here.
        videoUrl:
          type: string
          description: Public URL the video will be reachable at after the PUT completes; pass this to /ai/analyze-video-caption.

    AiVideoCaptionRequest:
      type: object
      required: [vendorId, videoUrl]
      properties:
        vendorId:
          type: integer
        videoUrl:
          type: string
          description: Public URL of the vendor's uploaded video (from POST /media/upload-url + a PUT of the bytes).
        platform:
          type: string
        tone:
          type: string
        includeHashtags:
          type: boolean
        includeEmoji:
          type: boolean

    # ─── PRODUCT ────────────────────────────────────────────────────────────
    Product:

  /vendors/{id}/notifications:
    get:
      operationId: listVendorNotifications
      tags: [vendors]
      summary: In-app notifications for a vendor (most recent 50)
      description: Callable by the vendor owner (Clerk session matches the vendor) or an admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Notifications, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VendorNotification"
        "403":
          description: Forbidden — not this vendor's owner and not an admin
        "404":
          description: Vendor not found
    post:
      operationId: createVendorNotification
      tags: [vendors]
      summary: Admin sends a custom in-app + email message to a single vendor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorNotificationInput"
      responses:
        "201":
          description: Created notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorNotification"
        "403":
          description: Admin access required
        "404":
          description: Vendor not found

  /vendors/{id}/notifications/{nid}/read:
    patch:
      operationId: markVendorNotificationRead
      tags: [vendors]
      summary: Mark a notification as read
      description: >
        Sets readAt to the current timestamp on the given notification.
        Callable by the vendor owner (Clerk session matches the vendor) or an admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: nid
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated notification with readAt set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorNotification"
        "403":
          description: Forbidden — not this vendor's owner and not an admin
        "404":
          description: Vendor or notification not found

  /vendors/notifications/bulk:
    post:
      operationId: createBulkVendorNotifications
      tags: [vendors]
      summary: Admin sends a custom in-app + email message to several vendors at once
      description: >
        Targets either an explicit `vendorIds` list or, when `all` is true, every vendor.
        The in-app notification is always created; the announcement email is best-effort
        and does not block or fail the request if delivery to some vendors fails.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkVendorNotificationInput"
      responses:
        "201":
          description: Bulk send result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkVendorNotificationResult"
        "400":
          description: Missing message, or no vendorIds given and all is not true
        "403":
          description: Admin access required
        "404":
          description: No matching vendors found

  # ─── ADMIN ────────────────────────────────────────────────────────────────
  /admin/message-history:
    get:
      operationId: getAdminMessageHistory
      tags: [admin]
      summary: Admin-facing history of every custom message sent to vendors
      description: >
        Covers messages sent via the per-vendor compose dialog and the bulk-message tool
        (notification type "general"). Optionally filter to a single vendor.
      parameters:
        - name: vendorId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Messages, most recent first (max 200)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminMessageHistoryEntry"
        "400":
          description: Invalid vendorId
        "403":
          description: Admin access required

  # ─── EXTERNAL (AWAJIMAA BRIDGE) ──────────────────────────────────────────
  /external/auth/handshake:
    post:
      operationId: externalAuthHandshake
      tags: [external]
      summary: Exchange an Awajimaa API key + user identity for a VendorHub session token
      description: >
        Called once when an Awajimaa user opens the VendorHub mobile app.
        Auto-creates (or finds) the matching vendor profile and returns a
        signed JWT to use as a bearer token on all other /external/* routes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalHandshakeInput"
      responses:
        "200":
          description: Session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalHandshakeResponse"
        "401":
          description: Missing or invalid API key
        "400":
          description: Missing or invalid fields

  /external/auth/mobile-handshake:
    post:
      operationId: externalAuthMobileHandshake
      tags: [external]
      summary: Exchange a signed-in Clerk session for a VendorHub session token (first-party mobile app)
      description: >
        Called directly by the VendorHub Mobile app itself (not a
        third-party partner backend), after the vendor has signed in with
        Clerk. Requires a valid Clerk session (Authorization bearer token
        verified by clerkMiddleware) — identity is never self-declared by
        the request body. Auto-creates (or finds) the matching vendor
        profile keyed by the verified Clerk user id, and returns a signed
        JWT to use as a bearer token on all other /external/* routes.
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalMobileHandshakeInput"
      responses:
        "200":
          description: Session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalHandshakeResponse"
        "401":
          description: Missing or invalid Clerk session
        "400":
          description: Missing or invalid fields

  /external/auth/revoke:
    post:
      operationId: externalAuthRevoke
      tags: [external]
      summary: Revoke an external session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalRevokeInput"
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalRevokeResponse"

  /external/profile:
    get:
      operationId: getExternalProfile

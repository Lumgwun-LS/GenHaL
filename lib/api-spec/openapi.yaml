openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: VendorHub - Multivendor Social Media, Sales & Inventory Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: vendors
    description: Vendor management
  - name: social-accounts
    description: Connected social media accounts
  - name: posts
    description: Social media posts
  - name: ai
    description: AI content generation
  - name: products
    description: Product & inventory management
  - name: inventory
    description: Inventory transactions
  - name: orders
    description: Sales orders
  - name: leads
    description: Lead management & scraping
  - name: email-campaigns
    description: Email marketing campaigns
  - name: sms-campaigns
    description: SMS marketing campaigns
  - name: analytics
    description: Dashboard analytics
  - name: sales
    description: Unified sales ledger (manual + auto-synced from payments)
  - name: expenses
    description: Categorized business expenses
  - name: investments
    description: Owner capital and external investment/asset tracking
  - name: branches
    description: Vendor organization branch offices/locations
  - name: workers
    description: Staff members belonging to a vendor's organization
  - name: external
    description: Awajimaa bridge — mobile app / external partner access
  - name: admin
    description: Admin-only operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── VENDORS ──────────────────────────────────────────────────────────────
  /vendors:
    get:
      operationId: listVendors
      tags: [vendors]
      summary: List all vendors
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: industry
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of vendors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vendor"
    post:
      operationId: createVendor
      tags: [vendors]
      summary: Create a vendor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorInput"
      responses:
        "201":
          description: Created vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"

  /vendors/onboarding:
    post:
      operationId: onboardVendor
      tags: [vendors]
      summary: Complete first-time vendor onboarding for the signed-in Clerk user
      description: >
        Creates the vendor profile for the current Clerk user on first sign-in. Email and
        clerkUserId are derived server-side from the verified Clerk session, never from the
        request body. If a vendor profile already exists for this user, it is returned as-is.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorOnboardingInput"
      responses:
        "200":
          description: Existing vendor profile (already onboarded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "201":
          description: Newly created vendor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"

  /vendors/stats:
    get:
      operationId: getVendorStats
      tags: [vendors]
      summary: Get vendor stats
      responses:
        "200":
          description: Vendor statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorStats"

  /vendors/{id}:
    get:
      operationId: getVendor
      tags: [vendors]
      summary: Get a vendor by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "404":
          description: Not found
    patch:
      operationId: updateVendor
      tags: [vendors]
      summary: Update a vendor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorUpdate"
      responses:
        "200":
          description: Updated vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
    delete:
      operationId: deleteVendor
      tags: [vendors]
      summary: Delete a vendor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── SOCIAL ACCOUNTS ──────────────────────────────────────────────────────
  /social-accounts:
    get:
      operationId: listSocialAccounts
      tags: [social-accounts]
      summary: List connected social accounts
      parameters:
        - name: vendorId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of social accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SocialAccount"
    post:
      operationId: createSocialAccount
      tags: [social-accounts]
      summary: Connect a social media account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialAccountInput"
      responses:
        "201":
          description: Connected account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialAccount"

  /social-accounts/{id}:
    get:
      operationId: getSocialAccount
      tags: [social-accounts]
      summary: Get a social account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Social account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialAccount"
    delete:
      operationId: deleteSocialAccount
      tags: [social-accounts]
      summary: Disconnect a social account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Disconnected

  # ─── POSTS ────────────────────────────────────────────────────────────────
  /posts:
    get:
      operationId: listPosts
      tags: [posts]
      summary: List posts
      parameters:
        - name: vendorId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
        - name: platform
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
    post:
      operationId: createPost
      tags: [posts]
      summary: Create a post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /posts/scheduled:
    get:
      operationId: listScheduledPosts
      tags: [posts]
      summary: Get upcoming scheduled posts
      responses:
        "200":
          description: Scheduled posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"

  /posts/{id}:
    get:
      operationId: getPost
      tags: [posts]
      summary: Get a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
    patch:
      operationId: updatePost
      tags: [posts]
      summary: Update a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostUpdate"
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
    delete:
      operationId: deletePost
      tags: [posts]
      summary: Delete a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /posts/{id}/publish:
    post:
      operationId: publishPost
      tags: [posts]
      summary: Publish a post immediately to each of its connected platforms
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Published post, plus the per-platform publish outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostWithPublications"
        "502":
          description: Publishing failed on every selected platform
          content:
            application/json:
              schema:
                type: object
                required: [error, publications]
                properties:
                  error:
                    type: string
                  publications:
                    type: array
                    items:
                      $ref: "#/components/schemas/PostPublication"

  /posts/{id}/publications:
    get:
      operationId: listPostPublications
      tags: [posts]
      summary: History of publish attempts for a post, one row per platform per attempt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Publish attempts, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PostPublication"

  /posts/{id}/submit-for-review:
    post:
      operationId: submitPostForReview
      tags: [posts]
      summary: Submit a draft post for vendor/admin approval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Post now pending review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /posts/{id}/approve:
    post:
      operationId: approvePost
      tags: [posts]
      summary: Approve a post that is pending review
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approved post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /posts/{id}/request-changes:
    post:
      operationId: requestPostChanges
      tags: [posts]
      summary: Send a pending-review post back to draft for edits
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Post sent back to draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /posts/{id}/schedule:
    post:
      operationId: schedulePost
      tags: [posts]
      summary: Schedule an approved post to auto-publish at a future date/time
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulePostInput"
      responses:
        "200":
          description: Post scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /posts/{id}/cancel-schedule:
    post:
      operationId: cancelPostSchedule
      tags: [posts]
      summary: Cancel a pending schedule and send the post back to draft
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Post moved back to draft, schedule cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  # ─── AI CONTENT ───────────────────────────────────────────────────────────
  /ai/generate-image:
    post:
      operationId: generateAiImage
      tags: [ai]
      summary: Generate an AI image for a post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiImageRequest"
      responses:
        "200":
          description: Generated image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiGeneration"

  /ai/generate-video:
    post:
      operationId: generateAiVideo
      tags: [ai]
      summary: Generate a short AI video for a post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiVideoRequest"
      responses:
        "200":
          description: Generated video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiGeneration"

  /ai/generate-caption:
    post:
      operationId: generateAiCaption
      tags: [ai]
      summary: Generate AI caption/copy for a post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiCaptionRequest"
      responses:
        "200":
          description: Generated caption
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiGeneration"

  /ai/upload-video-url:
    post:
      operationId: getAiVideoUploadUrl
      tags: [ai]
      summary: Get a presigned URL to upload a vendor's own video for AI caption analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiVideoUploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL and the public URL it will be served at once uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiVideoUploadUrlResponse"

  /ai/analyze-video-caption:
    post:
      operationId: analyzeVideoCaption
      tags: [ai]
      summary: Analyze an uploaded video's content and generate a caption/post for it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiVideoCaptionRequest"
      responses:
        "200":
          description: Generated caption based on the video's actual content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiGeneration"

  /ai/generations:
    get:
      operationId: listAiGenerations
      tags: [ai]
      summary: List AI generation history
      parameters:
        - name: vendorId
          in: query
          schema:
            type: integer
        - name: type
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of AI generations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiGeneration"

  # ─── PRODUCTS ─────────────────────────────────────────────────────────────
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products
      parameters:
        - name: vendorId
          in: query
          schema:
            type: integer
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: lowStock
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/low-stock:
    get:
      operationId: listLowStockProducts
      tags: [products]
      summary: List products with low stock
      responses:
        "200":
          description: Low stock products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── INVENTORY ────────────────────────────────────────────────────────────
  /inventory/transactions:
    get:
      operationId: listInventoryTransactions
      tags: [inventory]
      summary: List inventory transactions
      parameters:
        - name: productId
          in: query
          schema:
            type: integer
        - name: vendorId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Inventory transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryTransaction"
    post:
      operationId: createInventoryTransaction
      tags: [inventory]
      summary: Record inventory transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryTransactionInput"
      responses:
        "201":
          description: Created transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryTransaction"

  /inventory/summary:
    get:
      operationId: getInventorySummary
      tags: [inventory]
      summary: Get inventory summary stats
      parameters:
        - name: vendorId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Inventory summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventorySummary"

  # ─── ORDERS ───────────────────────────────────────────────────────────────
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List sales orders
      parameters:
        - name: vendorId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
        - name: branchId
          in: query
          schema:
            type: integer
        - name: workerId
          in: query
          schema:
            type: integer
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a sales order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/summary:
    get:
      operationId: getOrdersSummary
      tags: [orders]
      summary: Sales summary & revenue stats
      parameters:
        - name: vendorId
          in: query
          schema:
            type: integer
        - name: period
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Sales summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdersSummary"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
    patch:
      operationId: updateOrder
      tags: [orders]
      summary: Update order status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  # ─── SALES ────────────────────────────────────────────────────────────────
  /sales:
    get:
      operationId: listSales
      tags: [sales]
      summary: List sales (manual + auto-synced from paid payments)
      parameters:
        - name: vendorId
          in: query
          schema:
            type: integer
        - name: source
          in: query
          schema:
            type: string
        - name: branchId
          in: query
          schema:
            type: integer
        - name: workerId
          in: query
          schema:
            type: integer
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of sales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"
    post:
      operationId: createSale
      tags: [sales]
      summary: Record a manual sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleInput"
      responses:
        "201":
          description: Created sale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"

  /sales/export:
    get:
      operationId: exportSales
      tags: [sales]
      summary: Export sales as CSV
      parameters:
        - name: vendorId
          in: query
          required: true
          schema:
            type: integer
        - name: branchId
          in: query
          schema:
            type: integer
        - name: workerId
          in: query
          schema:
            type: integer
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

  /sales/{id}:
    patch:
      operationId: updateSale
      tags: [sales]
      summary: Update a manual sale
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleUpdate"
      responses:
        "200":
          description: Updated sale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
    delete:
      operationId: deleteSale
      tags: [sales]
      summary: Delete a manual sale
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── EXPENSES ─────────────────────────────────────────────────────────────
  /expenses:
    get:
      operationId: listExpenses
      tags: [expenses]
      summary: List expenses
      parameters:
        - name: vendorId
          in: query
          schema:
            type: integer
        - name: category
          in: query
          schema:
            type: string
        - name: branchId
          in: query
          schema:
            type: integer
        - name: workerId
          in: query
          schema:
            type: integer
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
